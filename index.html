<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kế toán DOSCOM — Xử lý sao kê</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success-bg: #ecfdf5;
      --success: #047857;
      --error-bg: #fef2f2;
      --error: #b91c1c;
      --info-bg: #eff6ff;
      --info: #1d4ed8;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
    }
    .topbar {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 16px;
    }
    .topbar h1 { font-size: 16px; margin: 0; font-weight: 600; }
    .topbar .sub { font-size: 13px; color: var(--text-muted); margin: 0; }
    .container {
      max-width: 1200px;
      margin: 32px auto;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    @media (max-width: 820px) {
      .container { grid-template-columns: 1fr; }
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    .panel h2 {
      font-size: 15px;
      margin: 0 0 4px;
      font-weight: 600;
      display: flex; align-items: center; gap: 8px;
    }
    .panel .desc {
      font-size: 13px;
      color: var(--text-muted);
      margin: 0 0 20px;
    }
    input[type="file"] { display: none; }
    .choose-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: #fff;
      color: var(--primary);
      border: 1px solid var(--primary);
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .choose-btn:hover { background: var(--info-bg); }
    .choose-btn svg { width: 16px; height: 16px; }
    .file-info {
      margin-top: 14px;
      padding: 12px 14px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      display: none;
      align-items: center;
      gap: 10px;
    }
    .file-info.show { display: flex; }
    .file-info .icon {
      width: 32px; height: 32px;
      background: var(--info-bg); color: var(--primary);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .file-info .meta { flex: 1; min-width: 0; }
    .file-info .fname {
      font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .file-info .fsize { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
    .file-info .remove {
      background: none; border: 0; cursor: pointer;
      color: var(--text-muted); padding: 4px; font-size: 16px;
      width: auto; margin: 0;
    }
    .file-info .remove:hover { color: var(--error); }
    button.primary {
      width: 100%;
      padding: 12px 16px;
      margin-top: 16px;
      background: var(--primary);
      color: #fff;
      border: 0;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button.primary:hover:not(:disabled) { background: var(--primary-hover); }
    button.primary:disabled { background: #cbd5e1; cursor: not-allowed; }
    button.secondary {
      padding: 8px 14px;
      background: #fff;
      color: var(--primary);
      border: 1px solid var(--primary);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    button.secondary:hover { background: var(--info-bg); }

    /* Right panel: result */
    .result-empty {
      text-align: center;
      padding: 40px 16px;
      color: var(--text-muted);
    }
    .result-empty svg { width: 56px; height: 56px; color: #cbd5e1; margin-bottom: 12px; }
    .result-empty p { margin: 0; font-size: 14px; }

    .result-state {
      display: none;
    }
    .result-state.show { display: block; }

    .status-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
    }
    .status-banner.info { background: var(--info-bg); color: var(--info); }
    .status-banner.success { background: var(--success-bg); color: var(--success); }
    .status-banner.error { background: var(--error-bg); color: var(--error); }
    .status-banner .badge-icon {
      width: 24px; height: 24px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .status-banner.success .badge-icon { background: var(--success); color: #fff; }
    .status-banner.error .badge-icon { background: var(--error); color: #fff; }
    .status-banner.info .badge-icon { background: var(--info); color: #fff; }

    .meta-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px 16px;
      font-size: 13px;
      margin-bottom: 16px;
    }
    .meta-grid dt { color: var(--text-muted); }
    .meta-grid dd { margin: 0; color: var(--text); word-break: break-all; }

    .spinner {
      width: 14px; height: 14px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="logo">KT</div>
    <div>
      <h1>Xử lý sao kê ngân hàng</h1>
      <p class="sub">Tự động tạo Phiếu thu / Phiếu chi từ file sao kê</p>
    </div>
  </header>

  <main class="container">
    <!-- LEFT: UPLOAD -->
    <section class="panel" aria-labelledby="upload-h">
      <h2 id="upload-h">Tải file lên</h2>
      <p class="desc">Chọn file sao kê ngân hàng (.xlsx hoặc .xls).</p>

      <label class="choose-btn" for="fileInput">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
        </svg>
        Chọn file
      </label>
      <input type="file" id="fileInput" accept=".xlsx,.xls" />

      <div class="file-info" id="fileInfo">
        <div class="icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
        </div>
        <div class="meta">
          <div class="fname" id="fileName"></div>
          <div class="fsize" id="fileSize"></div>
        </div>
        <button class="remove" id="removeBtn" title="Xóa file">✕</button>
      </div>

      <button class="primary" id="submitBtn" disabled>Xử lý &amp; tải kết quả</button>
    </section>

    <!-- RIGHT: RESULT -->
    <section class="panel" aria-labelledby="result-h">
      <h2 id="result-h">Kết quả</h2>
      <p class="desc">File kết quả sẽ tự động tải về máy sau khi xử lý.</p>

      <!-- Empty state -->
      <div class="result-empty" id="resultEmpty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <p>Chưa có file. Tải lên ở bên trái để xem kết quả.</p>
      </div>

      <!-- Processing / Result state -->
      <div class="result-state" id="resultState">
        <div class="status-banner" id="statusBanner">
          <span class="badge-icon" id="statusIcon"></span>
          <span id="statusText"></span>
        </div>

        <dl class="meta-grid" id="metaGrid">
          <dt>File kết quả</dt><dd id="metaFile">—</dd>
          <dt>Thời gian xử lý</dt><dd id="metaTime">—</dd>
          <dt>Cảnh báo (LOG)</dt><dd id="metaLog">—</dd>
        </dl>

        <button class="secondary" id="redownloadBtn" style="display:none;">Tải lại file</button>
      </div>
    </section>
  </main>

  <script>
    const fileInput = document.getElementById('fileInput');
    const fileInfo = document.getElementById('fileInfo');
    const fileName = document.getElementById('fileName');
    const fileSize = document.getElementById('fileSize');
    const removeBtn = document.getElementById('removeBtn');
    const submitBtn = document.getElementById('submitBtn');

    const resultEmpty = document.getElementById('resultEmpty');
    const resultState = document.getElementById('resultState');
    const statusBanner = document.getElementById('statusBanner');
    const statusIcon = document.getElementById('statusIcon');
    const statusText = document.getElementById('statusText');
    const metaFile = document.getElementById('metaFile');
    const metaTime = document.getElementById('metaTime');
    const metaLog = document.getElementById('metaLog');
    const redownloadBtn = document.getElementById('redownloadBtn');

    let currentFile = null;
    let lastBlobUrl = null;
    let lastFilename = null;

    function setFile(file) {
      currentFile = file;
      if (file) {
        fileName.textContent = file.name;
        fileSize.textContent = (file.size / 1024).toFixed(1) + ' KB';
        fileInfo.classList.add('show');
        submitBtn.disabled = false;
      } else {
        fileInput.value = '';
        fileInfo.classList.remove('show');
        submitBtn.disabled = true;
      }
    }

    function showResultState() {
      resultEmpty.style.display = 'none';
      resultState.classList.add('show');
    }

    function setStatus(kind, text, iconSvg) {
      statusBanner.className = 'status-banner ' + kind;
      statusIcon.innerHTML = iconSvg;
      statusText.textContent = text;
    }
    const ICON_SPIN = '<div class="spinner"></div>';
    const ICON_CHECK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    const ICON_X = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';

    fileInput.addEventListener('change', e => {
      if (e.target.files.length) setFile(e.target.files[0]);
    });
    removeBtn.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      setFile(null);
    });

    function triggerDownload(blobUrl, filename) {
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    redownloadBtn.addEventListener('click', () => {
      if (lastBlobUrl && lastFilename) triggerDownload(lastBlobUrl, lastFilename);
    });

    submitBtn.addEventListener('click', async () => {
      if (!currentFile) return;
      submitBtn.disabled = true;
      showResultState();
      setStatus('info', 'Đang xử lý, vui lòng chờ...', ICON_SPIN);
      metaFile.textContent = currentFile.name;
      metaTime.textContent = '...';
      metaLog.textContent = '...';
      redownloadBtn.style.display = 'none';

      const startTs = Date.now();
      const fd = new FormData();
      fd.append('file', currentFile);

      try {
        const res = await fetch('/api/process', { method: 'POST', body: fd });
        if (!res.ok) {
          let errMsg = 'HTTP ' + res.status;
          try {
            const j = await res.json();
            if (j.error) errMsg = j.error;
          } catch {}
          throw new Error(errMsg);
        }
        const cd = res.headers.get('Content-Disposition') || '';
        const m = cd.match(/filename\*?=(?:UTF-8'')?"?([^";]+)"?/);
        const filename = m ? decodeURIComponent(m[1]) : 'Ket-qua.xlsx';
        const logCount = res.headers.get('X-Log-Count') || '0';

        const blob = await res.blob();
        if (lastBlobUrl) URL.revokeObjectURL(lastBlobUrl);
        lastBlobUrl = URL.createObjectURL(blob);
        lastFilename = filename;
        triggerDownload(lastBlobUrl, filename);

        const elapsed = ((Date.now() - startTs) / 1000).toFixed(1);
        setStatus('success', 'Hoàn tất — file đã tải về máy.', ICON_CHECK);
        metaFile.textContent = filename;
        metaTime.textContent = elapsed + ' giây';
        metaLog.textContent = logCount === '0' ? 'Không có cảnh báo' : (logCount + ' dòng — xem sheet LOG trong file');
        redownloadBtn.style.display = 'inline-block';
      } catch (err) {
        setStatus('error', 'Lỗi: ' + err.message, ICON_X);
        metaTime.textContent = '—';
        metaLog.textContent = '—';
      } finally {
        submitBtn.disabled = !currentFile;
      }
    });
  </script>
</body>
</html>
